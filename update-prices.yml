name: Atualizar cotações da Carteira Viva

on:
  schedule:
    # 06:05 UTC = 03:05 no horário de Brasília, todo dia
    - cron: "5 6 * * *"
  workflow_dispatch: {} # permite rodar manualmente pela aba Actions

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Buscar cotações e atualizar o Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/update-prices.mjs
